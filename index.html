<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cogniterm Design System</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ds.css?v=6036a58c">
<link rel="stylesheet" href="ds-vuetify.css?v=6036a58c">
<link rel="stylesheet" href="docs.css?v=6036a58c">
<script>
/* 캐시 자가 복구 — 자세한 설명은 scripts-stamp.mjs 참고.
   한 번만 새로고침하도록 sessionStorage로 잠급니다(무한 새로고침 방지). */
(function () {
  var here = (document.querySelector('link[href*="docs.css?v="]') || {}).href || ''
  var mine = (here.split('?v=')[1] || '').split('&')[0]
  if (!mine) return
  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json() })
    .then(function (j) {
      if (!j.stamp || j.stamp === mine) return
      if (sessionStorage.getItem('ds-reloaded') === j.stamp) return
      sessionStorage.setItem('ds-reloaded', j.stamp)
      location.reload()
    })
    .catch(function () {})
})()
</script>
</head>
<body>

<a class="skip-link" href="#content">본문으로 건너뛰기</a>

<header class="topnav">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brandmark" href="#/">Cogniterm <span>Design System</span></a>
  <nav class="topnav-links">
    <a href="#/docs/start" data-nav="docs">Docs</a>
    <a href="#/foundation/overview" data-nav="foundation">Foundation</a>
    <a href="#/components" data-nav="components">Components</a>
    <a href="#/templates" data-nav="templates">Templates</a>
  </nav>
  <div class="topnav-right">
    <!-- 눌러서 여는 방아쇠 — 실제 입력은 커맨드 팔레트(⌘K) 안에서 합니다 -->
    <button class="searchwrap" id="searchBtn" aria-label="검색 열기 (⌘K)">
      <span id="searchIcon" class="search-ic"></span>
      <span class="searchbox-label">검색…</span>
      <kbd class="searchbox-kbd">⌘K</kbd>
    </button>
    <div id="palette" class="ds-palette-scrim" hidden></div>
    <a class="icon-btn" id="ghBtn" href="https://github.com/Cogniterm/design-system" target="_blank" rel="noopener" aria-label="GitHub"></a>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><span id="theme-icon"></span></button>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content" id="content"></main>
</div>

<script type="module" src="docs.js?v=6036a58c"></script>
</body>
</html>
