<link rel="stylesheet" href="docs.css?v=a66c5f13">
<script>
/* 캐시 자가 복구 — 자세한 설명은 scripts-stamp.mjs 참고.
   한 번만 새로고침하도록 sessionStorage로 잠급니다(무한 새로고침 방지). */
(function () {
  var here = (document.querySelector('link[href*="docs.css?v="]') || {}).href || ''
  var mine = (here.split('?v=')[1] || '').split('&')[0]
  if (!mine) return
  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json() })
    .then(function (j) {
      if (!j.stamp || j.stamp === mine) return
      if (sessionStorage.getItem('ds-reloaded') === j.stamp) return
      sessionStorage.setItem('ds-reloaded', j.stamp)
      location.reload()
    })
    .catch(function () {})
})()
</script>
<script>
/* 다크모드를 첫 페인트 전에 적용 — 부팅 로딩 화면이 라이트로 번쩍이지 않게 */
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'dark' ? 'dark' : 'light')
</script>
</head>
<body>

<!-- 부팅 로딩 화면 — DsLoadingScreen과 같은 스펙(도트 44 · 3D 스피어). docs.js가 첫 렌더 후 제거합니다. -->
<div class="loading-screen" id="boot" role="status" aria-label="불러오는 중">
  <div class="loading-screen__sphere" id="bootSphere" aria-hidden="true" style="width:50px;height:50px"></div>
</div>
<script>
(function () {
  var host = document.getElementById('bootSphere')
  var N = 44, R = 20.5, ISO = Math.atan(1 / Math.sqrt(2)), GA = Math.PI * (3 - Math.sqrt(5))
  var stops = [[11, 84, 189], [31, 127, 240], [122, 182, 247]]
  var bgv = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()
  var m = /^#([0-9a-f]{6})$/i.exec(bgv)
  var bg = m ? [0, 1, 2].map(function (j) { return parseInt(m[1].slice(j * 2, j * 2 + 2), 16) }) : [255, 255, 255]
  var pts = [], els = [], raf = 0, t0 = performance.now()
  for (var i = 0; i < N; i++) {
    var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = i * GA
    pts.push({ px: Math.cos(th) * r * R, py: y * R, pz: Math.sin(th) * r * R })
    var d = document.createElement('div')
    d.style.cssText = 'position:absolute;left:50%;top:50%;width:2.8px;height:2.8px;border-radius:50%;opacity:0;will-change:transform,opacity,background;'
    host.appendChild(d); els.push(d)
  }
  function grad(g, fade) {
    var seg = g < 0.5 ? 0 : 1, k = (g - seg * 0.5) * 2, a = stops[seg], b = stops[seg + 1], out = []
    for (var j = 0; j < 3; j++) { var v = a[j] + (b[j] - a[j]) * k; out.push(Math.round(v + (bg[j] - v) * fade)) }
    return 'rgb(' + out.join(',') + ')'
  }
  function paint(now) {
    var t = (now - t0) / 1000 * 2, P = 3.4
    var ph = (t % P) / P, su = Math.min(1, Math.max(0, (ph - 0.55) / 0.45)), sK = su * su * (3 - 2 * su)
    var cyc = Math.floor(t / P), axisY = cyc % 2 === 0
    var ry = t * 0.3 + (Math.ceil(cyc / 2) + (axisY ? sK : 0)) * Math.PI * 2 / 3
    var flips = Math.floor(cyc / 2) + (!axisY ? sK : 0)
    var rx = ISO * Math.cos(flips * Math.PI) + 0.09 * Math.sin(t * 0.5) + 0.05 * Math.sin(t * 1.27) - 0.12 * Math.sin(su * Math.PI)
    var cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx)
    var br = 1 + 0.07 * Math.sin(t * 0.9) - 0.14 * Math.sin(su * Math.PI)
    for (var i = 0; i < N; i++) {
      var p = pts[i]
      var x1 = p.px * cy + p.pz * sy, z1 = -p.px * sy + p.pz * cy
      var y2 = p.py * cx - z1 * sx, z2 = p.py * sx + z1 * cx
      var ripple = Math.max(0, Math.sin(t * 2.4 - (p.py / R + 1) * 1.5 * 1.6))
      var pf = 170 / (170 - z2), px = x1 * br * pf, py = y2 * br * pf
      if (p.x === undefined) { p.x = px; p.y = py }
      p.x += (px - p.x) * 0.22; p.y += (py - p.y) * 0.22
      var dn = (z2 / 22.8 + 1) / 2
      var entry = Math.min(1, Math.max(0, (t - 0.1 - i * 0.04) / 0.7))
      els[i].style.transform = 'translate(' + (p.x - 1.4).toFixed(1) + 'px,' + (p.y - 1.4).toFixed(1) + 'px) scale(' + (0.78 + 0.42 * dn + 0.22 * ripple).toFixed(3) + ')'
      els[i].style.opacity = (entry * (0.55 + 0.35 * dn + 0.1 * ripple)).toFixed(3)
      var la = -0.7 + 0.25 * Math.sin(t * 0.3)
      var lam = Math.max(0, Math.min(1, (x1 * Math.sin(la) * 0.8 + y2 * -0.55 + z2 * Math.cos(la) * 0.8) / R * 0.5 + 0.5))
      els[i].style.background = grad(1 - lam, (1 - dn) * 0.22)
    }
  }
  function loop(now) { raf = requestAnimationFrame(loop); paint(now) }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) paint(t0 + 2400)
  else raf = requestAnimationFrame(loop)
  window.__bootLoader = { destroy: function () { cancelAnimationFrame(raf) } }
})()
</script>
