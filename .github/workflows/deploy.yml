name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 검사를 다시 돌려서, 통과할 때만 사이트가 나갑니다.
  # (전에는 검사가 빨개도 배포가 그대로 나갔습니다.)
  verify:
    name: 배포 전 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts-check.mjs
      - run: node scripts-stamp.mjs --check
      # 브라우저 없이 docs.js를 실행해, 화면이 실제로 그려지는지 봅니다
      - run: node scripts-render.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # 플레이그라운드(live/)를 올리기 직전에 새로 만듭니다.
      #
      # 왜: 문서 사이트 Overview의 데모는 정적 HTML이 아니라 live/를 iframe으로 띄웁니다.
      # 전에는 저장소에 커밋된 live/를 그대로 올렸는데, 사람이 손으로 재빌드해야 해서
      # 2026-08-19~08-28 아흐레 동안 아무도 안 돌렸고 그 사이 모든 변경이 문서
      # 사이트에서만 안 보였습니다. 이제 배포가 매번 다시 만듭니다 —
      # **공개 사이트는 커밋된 live/가 낡아 있어도 최신입니다.**
      #
      # 스탬프도 이 안에서 다시 찍힙니다(scripts-build-live.mjs 5단계).
      # live/index.html이 해시 대상이라, 안 찍으면 방문자 브라우저가 옛 번들을 계속 씁니다.
      - name: 라이브 갤러리 빌드
        run: npm run live
      # ⚠ upload-pages-artifact는 path 아래를 통째로 담습니다(.gitignore를 보지 않습니다).
      #   방금 만든 node_modules와 dist를 안 걷어내면 아티팩트가 수백 MB로 붑니다.
      - name: 업로드 전 정리
        run: rm -rf examples/vuetify-app/node_modules examples/vuetify-app/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }
      - id: deployment
        uses: actions/deploy-pages@v4
